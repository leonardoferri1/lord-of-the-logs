services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs_local}
      POSTGRES_DB: logs
    ports: ['127.0.0.1:55432:5432']
    volumes: ['world-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logs -d logs']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgresql://logs:${POSTGRES_PASSWORD:-logs_local}@db:5432/logs
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      PORT: 3001
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ['8080:80']
    depends_on:
      server: { condition: service_healthy }
volumes:
  world-data:
